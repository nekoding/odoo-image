name: Build Odoo Docker Images

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Odoo version to build (e.g. 17.0) or "all" for all versions'
        required: false
        default: 'all'
      openupgrade_version:
        description: 'OpenUpgrade version to build (e.g. openupgrade-13.0) or "all"'
        required: false
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.filter.outputs.versions }}
    steps:
      - id: filter
        run: |
          ALL='["7.0","8.0","9.0","10.0","11.0","12.0","13.0","14.0","15.0","16.0","17.0","18.0","19.0"]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.version }}" != "all" ]]; then
            echo "versions=[\"${{ inputs.version }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo "versions=$ALL" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    name: Build Odoo ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.setup.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodule (depth 1)
        run: git submodule update --init --depth 1 ${{ matrix.version }}/src

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.version }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/odoo:${{ matrix.version }}
          cache-from: type=gha,scope=odoo-${{ matrix.version }}
          cache-to: type=gha,scope=odoo-${{ matrix.version }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  setup-openupgrade:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.filter.outputs.versions }}
    steps:
      - id: filter
        run: |
          ALL='["openupgrade-7.0","openupgrade-8.0","openupgrade-9.0","openupgrade-10.0","openupgrade-11.0","openupgrade-12.0","openupgrade-13.0"]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.openupgrade_version }}" != "all" && "${{ inputs.openupgrade_version }}" != "" ]]; then
            echo "versions=[\"${{ inputs.openupgrade_version }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo "versions=$ALL" >> "$GITHUB_OUTPUT"
          fi

  build-openupgrade:
    needs: setup-openupgrade
    name: Build OpenUpgrade ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.setup-openupgrade.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone OpenUpgrade source (depth 1)
        run: |
          VERSION=$(echo "${{ matrix.version }}" | sed 's/openupgrade-//')
          git clone --depth 1 --branch $VERSION https://github.com/OCA/OpenUpgrade.git ${{ matrix.version }}/src

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.version }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/odoo:${{ matrix.version }}
          cache-from: type=gha,scope=odoo-${{ matrix.version }}
          cache-to: type=gha,scope=odoo-${{ matrix.version }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.revision=${{ github.sha }}
